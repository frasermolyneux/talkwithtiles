name: Destroy Development

on:
  workflow_dispatch:
  schedule:
    - cron: "30 23 * * *"

permissions: {}

jobs:
  terraform-destroy-dev:
    permissions:
      id-token: write
      contents: read
    environment: Development
    runs-on: ubuntu-latest
    concurrency:
      group: ${{ github.repository }}-dev
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - uses: frasermolyneux/actions/terraform-destroy@terraform-destroy/v1.3
        with:
          terraform-folder: "terraform"
          terraform-var-file: "tfvars/dev.tfvars"
          terraform-backend-file: "backends/dev.backend.hcl"
          AZURE_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
          AZURE_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
          AZURE_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Login to Azure for destroy verification
        uses: azure/login@7184910d9eb2b1c5e48f7073824a90609bb9b6d6
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Verify development resources were destroyed
        shell: bash
        run: |
          resource_group="rg-talkwithtiles-dev-swedencentral"
          service_plan="asp-talkwithtiles-dev-swedencentral-default"
          failure_anomalies_rule="Failure Anomalies - ai-talkwithtiles-dev-swedencentral"

          failure_anomalies_id=$(az resource list \
            --resource-group "$resource_group" \
            --resource-type "Microsoft.AlertsManagement/smartDetectorAlertRules" \
            --query "[?name == '$failure_anomalies_rule'].id | [0]" \
            --output tsv)

          if [[ -n "$failure_anomalies_id" ]]; then
            az resource delete --ids "$failure_anomalies_id"
            az resource wait --deleted --ids "$failure_anomalies_id" --interval 10 --timeout 180
          fi

          service_plan_ids=$(az resource list \
            --resource-group "$resource_group" \
            --resource-type "Microsoft.Web/serverfarms" \
            --query "[?name == '$service_plan'].id" \
            --output tsv)
          residual_ids=$(az resource list \
            --resource-group "$resource_group" \
            --query "[].id" \
            --output tsv)

          if [[ -n "$service_plan_ids" || -n "$residual_ids" ]]; then
            echo "::error::Development destroy left resources in $resource_group."
            if [[ -n "$service_plan_ids" ]]; then
              echo "Residual service plan IDs:"
              printf '%s\n' "$service_plan_ids"
            fi
            if [[ -n "$residual_ids" ]]; then
              echo "Residual resource IDs:"
              printf '%s\n' "$residual_ids"
            fi
            exit 1
          fi
