name: Runtime Quality

on:
  push:
    branches: [main]
  workflow_dispatch:
  workflow_call:
    secrets:
      GH_APP_PEM:
        required: false

permissions: {}

jobs:
  validate-contract:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: Production
    permissions:
      contents: read
    env:
      PYTHONPATH: ${{ github.workspace }}/.ci-state/contract-deps
      TMPDIR: ${{ github.workspace }}/.ci-state
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Create read-only platform contract token
        id: platform-token
        uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349
        with:
          app-id: ${{ vars.GH_APP_ID }}
          private-key: ${{ secrets.GH_APP_PEM }}
          owner: ${{ github.repository_owner }}
          repositories: platform-baremetal
          permission-contents: read
      - name: Check out pinned private platform contract
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: frasermolyneux/platform-baremetal
          ref: 285d279cfd99bbc28498068246f8c0affe99b848
          path: .platform-contract
          token: ${{ steps.platform-token.outputs.token }}
          persist-credentials: false
      - name: Compile constrained workload contract without deployment
        run: |
          mkdir -p .ci-state
          python3 -m pip install --disable-pip-version-check --require-hashes \
            --target .ci-state/contract-deps \
            --requirement .platform-contract/.github/actions/validate-workload-manifest/requirements.lock
          python3 .platform-contract/ansible/roles/workload_contract/files/compile_manifest.py \
            workload.json \
            .platform-contract/ansible/roles/workload_contract/files/workload.schema.json \
            .github/validation/policy.json \
            .platform-contract/ansible/roles/workload_contract/files/policy.schema.json \
            .ci-state/compiled-contract

  postgres-and-containers:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      contents: read
    services:
      postgres:
        image: postgres:18-bookworm
        env:
          POSTGRES_DB: talkwithtiles
          POSTGRES_USER: talkwithtiles
          POSTGRES_PASSWORD: ${{ github.run_id }}-${{ github.run_attempt }}-ci-only
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U talkwithtiles -d talkwithtiles"
          --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      TEST_POSTGRES_PASSWORD: ${{ github.run_id }}-${{ github.run_attempt }}-ci-only
      TEST_POSTGRES_PASSWORD_FILE: ${{ github.workspace }}/.ci-state/database-password
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68
        with:
          dotnet-version: 10.0.x
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 24
      - name: Prepare disposable database credentials
        run: |
          mkdir -p .ci-state
          printf '%s' "$TEST_POSTGRES_PASSWORD" >"$TEST_POSTGRES_PASSWORD_FILE"
          chmod 0600 "$TEST_POSTGRES_PASSWORD_FILE"
      - name: Test real PostgreSQL persistence
        run: dotnet test src/MX.TalkWithTiles.slnx --nologo
      - name: Install browser dependencies
        run: npm ci && npx playwright install chromium --with-deps
      - name: Validate browser harness and promotion gates
        run: |
          npx tsc --noEmit
          python3 -m unittest discover -s deployment -p 'test_*.py'
      - name: Test deterministic multiplayer flows
        run: npx playwright test --project=chromium
      - name: Build constrained images
        run: |
          docker build --tag talkwithtiles-web:ci .
          docker build --file deployment/postgres.Dockerfile --tag talkwithtiles-postgres:ci .
      - name: Validate container constraints and persisted restart
        run: python3 deployment/test_containers.py
      - name: Record publishable image inputs
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          BEFORE_SHA: ${{ github.event.before }}
          SOURCE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          pattern="$(tr -d '\r\n' <.github/image-input-pattern.txt)"
          if [[ "$BEFORE_SHA" == 0000000000000000000000000000000000000000 ]]; then
            changed="$(git diff-tree --root --no-commit-id --name-only -r "$SOURCE_SHA")"
          else
            changed="$(git diff --name-only "$BEFORE_SHA" "$SOURCE_SHA")"
          fi
          if grep -Eq "$pattern" <<<"$changed"; then
            mkdir -p .ci-state/publish-image-inputs
            printf '%s\n' "$SOURCE_SHA" >.ci-state/publish-image-inputs/revision
          fi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        with:
          name: publish-image-inputs
          path: .ci-state/publish-image-inputs
          if-no-files-found: ignore
          retention-days: 1
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
