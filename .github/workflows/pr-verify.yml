name: PR Verify

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}-${{ github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: false

jobs:
  build-and-test:
    permissions:
      contents: read
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    outputs:
      test_report: ${{ steps.shared-tests-1.outputs.test-report }}
    steps:
      - id: shared-tests-1
        uses: frasermolyneux/actions/dotnet-web-ci@dotnet-web-ci/v2.1
        with:
          test-reporting: "true"
          dotnet-project: "MX.TalkWithTiles.Web"
          dotnet-version: 10.0.x
          src-folder: "src"

  e2e-tests:
    permissions:
      contents: read
    if: github.event.pull_request.draft == false
    needs: build-and-test
    uses: ./.github/workflows/runtime-quality.yml
    secrets:
      GH_APP_PEM: ${{ secrets.GH_APP_PEM }}

  terraform-plan-dev:
    permissions:
      contents: read
      id-token: write
      pull-requests: write
    if: ${{ false }} # Hosted Development is retired; retained definition is teardown context only.
    needs: build-and-test
    environment: Development
    runs-on: ubuntu-latest
    concurrency:
      group: ${{ github.repository }}-dev
    env:
      AZURE_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
      AZURE_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
      AZURE_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
    steps:
      - uses: frasermolyneux/actions/terraform-plan@terraform-plan/v2.0.0
        with:
          terraform-folder: "terraform"
          terraform-var-file: "tfvars/dev.tfvars"
          terraform-backend-file: "backends/dev.backend.hcl"
          AZURE_CLIENT_ID: ${{ env.AZURE_CLIENT_ID }}
          AZURE_TENANT_ID: ${{ env.AZURE_TENANT_ID }}
          AZURE_SUBSCRIPTION_ID: ${{ env.AZURE_SUBSCRIPTION_ID }}

  terraform-plan-prd:
    if: github.event.pull_request.draft == false && github.event.pull_request.head.repo.full_name == github.repository && contains(github.event.pull_request.labels.*.name, 'run-prd-plan')
    permissions:
      contents: read
      id-token: write
      pull-requests: write
    environment: Production
    runs-on: ubuntu-latest
    concurrency:
      group: ${{ github.repository }}-prd-plan
      cancel-in-progress: false
    env:
      TF_CLI_ARGS_plan: -lock-timeout=10m
    steps:
      - uses: frasermolyneux/actions/terraform-plan@terraform-plan/v2.0.0
        with:
          terraform-folder: terraform
          terraform-var-file: tfvars/prd.tfvars
          terraform-backend-file: backends/prd.backend.hcl
          plan-artifact-name: terraform-plan-prd
          AZURE_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
          AZURE_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
          AZURE_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}

  test-results:
    name: Test results summary
    if: always() && github.event.pull_request.draft == false
    needs: [build-and-test]
    permissions:
      pull-requests: write
    runs-on: ubuntu-latest
    concurrency:
      group: test-results-${{ github.repository }}-${{ github.event.pull_request.number }}
      cancel-in-progress: false
    steps:
      - uses: frasermolyneux/actions/test-results-summary@test-results-summary/v1
        with:
          jobs: ${{ toJSON(needs) }}
