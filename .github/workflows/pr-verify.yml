name: PR Verify

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  build-and-test:
    permissions:
      contents: read
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    outputs:
      test_report: ${{ steps.shared-tests-1.outputs.test-report }}
    steps:
      - id: shared-tests-1
        uses: frasermolyneux/actions/dotnet-web-ci@dotnet-web-ci/v2.1
        with:
          test-reporting: "true"
          dotnet-project: "MX.TalkWithTiles.Web"
          dotnet-version: 10.0.x
          src-folder: "src"

  e2e-tests:
    permissions:
      contents: read
    if: github.event.pull_request.draft == false
    needs: build-and-test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68
        with:
          dotnet-version: 10.0.x

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 20

      - name: Install Playwright dependencies
        run: |
          npm ci
          npx playwright install chromium --with-deps

      - name: Install Azurite
        run: npm install -g azurite

      - name: Start Azurite
        run: azurite-table --silent --tableHost 127.0.0.1 --tablePort 10002 &

      - name: Restore .NET dependencies
        run: dotnet restore src/MX.TalkWithTiles.slnx

      - name: Build .NET project
        run: dotnet build src/MX.TalkWithTiles.Web/MX.TalkWithTiles.Web.csproj --no-restore

      - name: Run Playwright tests
        run: npx playwright test --project=chromium
        env:
          CI: true

      - name: Upload Playwright report
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14

      - name: Upload test results
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: ${{ !cancelled() }}
        with:
          name: playwright-results
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7

  terraform-plan-dev:
    permissions:
      contents: read
      id-token: write
      pull-requests: write
    if: github.event.pull_request.draft == false && !contains(github.event.pull_request.labels.*.name, 'deploy-dev') && contains(fromJson('["opened","synchronize","reopened","ready_for_review"]'), github.event.action)
    needs: build-and-test
    environment: Development
    runs-on: ubuntu-latest
    concurrency:
      group: ${{ github.repository }}-dev
    env:
      AZURE_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
      AZURE_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
      AZURE_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
    steps:
      - uses: frasermolyneux/actions/terraform-plan@terraform-plan/v2.0.0
        with:
          terraform-folder: "terraform"
          terraform-var-file: "tfvars/dev.tfvars"
          terraform-backend-file: "backends/dev.backend.hcl"
          AZURE_CLIENT_ID: ${{ env.AZURE_CLIENT_ID }}
          AZURE_TENANT_ID: ${{ env.AZURE_TENANT_ID }}
          AZURE_SUBSCRIPTION_ID: ${{ env.AZURE_SUBSCRIPTION_ID }}

  terraform-plan-prd:
    if: github.event.pull_request.draft == false && github.event.pull_request.head.repo.full_name == github.repository
    permissions:
      contents: read
      id-token: write
      pull-requests: write
    environment: Production
    runs-on: ubuntu-latest
    concurrency:
      group: ${{ github.repository }}-prd
      cancel-in-progress: false
    steps:
      - uses: frasermolyneux/actions/terraform-plan@terraform-plan/v2.0.0
        with:
          terraform-folder: terraform
          terraform-var-file: tfvars/prd.tfvars
          terraform-backend-file: backends/prd.backend.hcl
          plan-artifact-name: terraform-plan-prd
          AZURE_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
          AZURE_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
          AZURE_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}

  test-results:
    name: Test results summary
    if: always() && github.event.pull_request.draft == false
    needs: [build-and-test]
    permissions:
      pull-requests: write
    runs-on: ubuntu-latest
    concurrency:
      group: test-results-${{ github.repository }}-${{ github.event.pull_request.number }}
      cancel-in-progress: false
    steps:
      - uses: frasermolyneux/actions/test-results-summary@test-results-summary/v1
        with:
          jobs: ${{ toJSON(needs) }}
