name: Publish Image

on:
  workflow_run:
    workflows: [Runtime Quality]
    types: [completed]

permissions: {}

jobs:
  publish:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: Production
    concurrency:
      group: ${{ github.repository }}-publish-${{ github.event.workflow_run.head_sha }}
      cancel-in-progress: false
    permissions:
      actions: read
      contents: read
      id-token: write
    env:
      GH_TOKEN: ${{ github.token }}
      SOURCE_SHA: ${{ github.event.workflow_run.head_sha }}
      WORKLOAD_ACR_NAME: ${{ vars.WORKLOAD_ACR_NAME }}
      AZURE_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
      DOCKER_CONFIG: ${{ github.workspace }}/.ci-state/docker
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0
      - name: Require publishable source inputs
        id: inputs
        env:
          RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          set -euo pipefail
          count="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RUN_ID/artifacts?per_page=100" --jq '[.artifacts[] | select(.name == "publish-image-inputs" and .expired == false)] | length')"
          test "$count" -le 1
          if [[ "$count" == 1 ]]; then
            gh run download "$RUN_ID" --name publish-image-inputs --dir .ci-state/publish-image-inputs
            test "$(cat .ci-state/publish-image-inputs/revision)" = "$SOURCE_SHA"
            echo "publish=true" >>"$GITHUB_OUTPUT"
          fi
      - uses: azure/login@532459ea530d8321f2fb9bb10d1e0bcf23869a43
        if: steps.inputs.outputs.publish == 'true'
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: Publish both constrained images
        if: steps.inputs.outputs.publish == 'true'
        run: python3 .github/scripts/publish-images.py
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: steps.inputs.outputs.publish == 'true'
        with:
          name: image-promotion
          path: promotion/payload.json
          if-no-files-found: error
          retention-days: 1
      - name: Remove short-lived registry login
        if: always()
        run: rm -rf .ci-state/docker
