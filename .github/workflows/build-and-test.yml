name: Build and Test

on:
  push:
    branches:
      - "feature/**"
      - "bugfix/**"
      - "hotfix/**"

permissions: {}

jobs:
  detect-changes:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    outputs:
      src: ${{ steps.changes.outputs.src }}
      terraform: ${{ steps.changes.outputs.terraform }}
      playwright: ${{ steps.changes.outputs.playwright }}
    steps:
      - id: changes
        # detect-changes/v1.0.4 @ 8e7ca58b7821e01192ee4f23756c55e4ee057496
        uses: frasermolyneux/actions/detect-changes@8e7ca58b7821e01192ee4f23756c55e4ee057496
        # The shared action exposes fixed output names; src covers all runtime inputs.
        with:
          filters: |
            src:src/**,Dockerfile,deployment/**,.dockerignore,workload.json,global.json,Directory.Build.props,version.json,package-lock.json,.github/**
            terraform:terraform/**
            playwright:e2e/**,playwright.config.ts,global-setup.ts,fixtures/**,helpers/**,pages/**,package.json

  build-and-test:
    needs: detect-changes
    if: needs.detect-changes.outputs.src == 'true'
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      # dotnet-web-ci/v3.0.1 @ a6271c58ed8e8f3b6fbdb738ac7566863fdc38c8
      - uses: frasermolyneux/actions/dotnet-web-ci@a6271c58ed8e8f3b6fbdb738ac7566863fdc38c8
        with:
          test-reporting: "true"
          dotnet-project: "MX.TalkWithTiles.Web"
          dotnet-version: 10.0.x
          src-folder: "src"

  e2e-tests:
    needs:
      - detect-changes
      - build-and-test
    if: |
      !failure() && !cancelled() && (needs.detect-changes.outputs.src == 'true' || needs.detect-changes.outputs.playwright == 'true')
    permissions:
      contents: read
    uses: ./.github/workflows/runtime-quality.yml

  terraform-plan-dev:
    needs: detect-changes
    if: ${{ false }} # Hosted Development is retired.
    permissions:
      contents: read
      id-token: write
    runs-on: ubuntu-latest
    environment: Development
    concurrency:
      group: ${{ github.repository }}-dev
    steps:
      # terraform-plan/v5.0.0 @ 027d7e31bb32b734090aaed01b36d74f1d658b61
      - uses: frasermolyneux/actions/terraform-plan@027d7e31bb32b734090aaed01b36d74f1d658b61
        with:
          terraform-version: 1.17.0
          terraform-environment: dev
          terraform-folder: "terraform"
          terraform-var-file: "tfvars/dev.tfvars"
          terraform-backend-file: "backends/dev.backend.hcl"
          AZURE_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
          AZURE_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
          AZURE_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
